<body><main style="max-width:760px;margin:50px auto;padding:30px"><p>ResumeKit 本地测试 · 所有公司、岗位均为虚构</p><h1>前端开发工程师</h1><p class="company-name">示例科技有限公司</p><p>先使用插件填写简历，再识别岗位、核对并提交。本页不会发送申请或上传数据。</p><label>测试情形 <select id="scenario"><option value="success">显示成功提示</option><option value="failure">显示失败提示</option><option value="unknown">结果不明确</option><option value="stale">已有成功提示（应保持待确认）</option><option value="ambiguous">多个提交按钮</option><option value="navigate">提交后同站跳转</option><option value="conflict">成功和失败提示同时出现</option></select></label><p id="old-result" hidden>投递成功</p>
<form id="application"><label>姓名 * <input id="candidate-name" name="name" autocomplete="name" required></label><label>邮箱 * <input id="email" name="email" type="email" required></label><label><input id="agreement" type="checkbox" required>我已核对资料并同意提交本次演示申请</label><p><button type="submit" id="apply">提交申请</button><button id="second" type="button" hidden>立即投递</button></p></form><p id="result" role="status"></p><p id="conflict" role="alert"></p><a href="index.html">返回完整填表测试页</a></main></body></html>
