<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>简历速填 + 投递簿</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="tracker.css"><script src="shared/profile.js" defer></script><script src="popup.js" defer></script></head>
<body class="popup-page">
  <header class="popup-header"><div class="brand"><span class="brand-icon">R<span>↗</span></span><span>简历速填 + 投递簿<small>RESUME KIT · 2.0</small></span></div><button id="edit" class="text-button">编辑资料 ↗</button></header>
  <section class="profile-summary"><span id="avatar" class="avatar">人</span><div><b id="profile-name">我的简历</b><p id="profile-meta">正在读取资料…</p></div><span class="subtle-badge">仅本机</span></section>
  <p class="popup-intro">在申请页面扫描字段，核对后一次填入。<br>多段经历请先在网页添加对应的空白行。</p>
  <button id="scan" class="primary scan-button">扫描当前页面</button>
  <label class="overwrite-option"><input id="overwrite" type="checkbox">允许覆盖网页已有内容（更改后需重新扫描）</label>
  <section id="preview" hidden><div class="preview-heading"><h2 id="preview-count">填写预览</h2><label><input id="select-all" type="checkbox">全选可填项</label></div><div id="preview-list" class="preview-list"></div><button id="fill" class="primary fill-button">填入勾选项</button></section>
  <p id="status" class="popup-status" role="status" hidden></p>
  <div class="popup-secondary"><button id="manual">手动指定字段</button><button id="undo">撤销本页填写</button></div>
  <section class="delivery-section"><div class="delivery-heading"><h2>投递后，自动记一笔</h2><button id="open-tracker" class="text-button">我的投递簿 ↗</button></div><p>先核对网页，再确认公司与岗位。成功提示出现后记为已投递；结果不明确时保留待确认。</p><button id="prepare" class="prepare-button">识别岗位，准备提交</button>
    <div id="delivery-editor" hidden>
      <label class="field"><span>公司名称</span><input id="job-company" maxlength="120" autocomplete="off" placeholder="请核对公司名称"></label>
      <label class="field"><span>岗位名称</span><input id="job-role" maxlength="160" autocomplete="off" placeholder="请核对岗位名称"></label>
      <div class="delivery-grid"><label class="field"><span>工作地点</span><input id="job-location" maxlength="100"></label><label class="field"><span>简历版本</span><input id="job-resume" maxlength="160" placeholder="例如：前端岗 v2"></label></div>
      <p id="submit-hint"></p>
      <label class="review-option"><input type="checkbox" id="reviewed">我已核对网页资料、附件和协议，确认提交此岗位申请</label>
      <button id="submit" class="primary" disabled>一键提交并记录</button><button id="arm">由我在网页提交，开启自动记录</button>
    </div>
  </section>
  <footer class="popup-footer">资料和投递记录保存在本机，可在投递簿导出备份。</footer>
</body></html>
